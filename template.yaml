AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  Hello World AWS Lambda and Amazon API Gateway REST API
  Sample AWS SAM template to create a simple Lambda function connected to a REST API.

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3

Resources:
  HelloWorldFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: hello_world/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - x86_64
      Events:
        HelloWorld:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /monitors
            Method: post    
      Environment:
        Variables:
          MONITORS_TABLE: !Ref MonitorsTable 
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem 
              Resource: !GetAtt MonitorsTable.Arn
  MonitorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST 
      AttributeDefinitions:
        - AttributeName: monitor_id
          AttributeType: S 
      KeySchema:
        - AttributeName: monitor_id
          KeyType: HASH 
  CheckQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 345600 # 4 days in seconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CheckDLQ.Arn
        maxReceiveCount: 3
      VisibilityTimeout: 90
  CheckDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days in seconds
  DispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: dispatcher.lambda_handler
      Runtime: python3.14
      Timeout: 30
      Environment:
        Variables:
          MONITORS_TABLE: !Ref MonitorsTable
          CHECK_QUEUE_URL: !Ref CheckQueue 
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource: !GetAtt MonitorsTable.Arn
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt CheckQueue.Arn
      Events:
        DispatchSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: false
  CheckResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: monitor_id
          AttributeType: S
        - AttributeName: checked_at
          AttributeType: S
      KeySchema:
        - AttributeName: monitor_id
          KeyType: HASH
        - AttributeName: checked_at
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: worker.lambda_handler
      Runtime: python3.14
      Timeout: 15
      Environment:
        Variables:
          CHECK_RESULTS_TABLE: !Ref CheckResultsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt CheckResultsTable.Arn
      Events:
        CheckQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt CheckQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  HelloWorldApi:
    Description: API Gateway endpoint URL for Prod stage for Hello World function
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/monitors
  HelloWorldFunction:
    Description: Hello World Lambda Function ARN
    Value: !GetAtt HelloWorldFunction.Arn
  HelloWorldFunctionIamRole:
    Description: Implicit IAM Role created for Hello World function
    Value: !GetAtt HelloWorldFunctionRole.Arn