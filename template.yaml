AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  AWS Serverless Uptime and Webhook Monitor
  SAM template for API Gateway, Lambda, SQS, DynamoDB, EventBridge, and SNS.

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3

Parameters:
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional email address for SNS transition alerts
  EnableEmailAlerts:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Create an email subscription for SNS transition alerts
  CloudFrontWebACLArn:
    Type: String
    Default: ''
    Description: Optional CloudFront-scope WAF web ACL ARN required by some distribution plans
  EnableDispatchSchedule:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable recurring monitor checks when deploying the stack

Conditions:
  EnableEmailAlertsCondition: !Equals
    - !Ref EnableEmailAlerts
    - 'true'
  HasCloudFrontWebACL: !Not
    - !Equals
      - !Ref CloudFrontWebACLArn
      - ''
  EnableDispatchScheduleCondition: !Equals
    - !Ref EnableDispatchSchedule
    - 'true'

Resources:
  CreateMonitorFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: uptime_monitor/
      Handler: app.lambda_handler
      Runtime: python3.14
      Timeout: 10
      Architectures:
        - x86_64
      Events:
        CreateMonitor:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /monitors
            Method: post
            RestApiId: !Ref MonitorRestApi
      Environment:
        Variables:
          MONITORS_TABLE: !Ref MonitorsTable
          MONITOR_QUOTA_TABLE: !Ref MonitorQuotaTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt MonitorsTable.Arn
                - !GetAtt MonitorQuotaTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt MonitorQuotaTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt MonitorsTable.Arn
  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: uptime_monitor/
      Handler: dashboard.lambda_handler
      Runtime: python3.14
      Timeout: 10
      Environment:
        Variables:
          MONITORS_TABLE: !Ref MonitorsTable
          CHECK_RESULTS_TABLE: !Ref CheckResultsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt MonitorsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt CheckResultsTable.Arn
      Events:
        PublicDashboard:
          Type: Api
          Properties:
            Path: /status
            Method: get
            RestApiId: !Ref MonitorRestApi
            Auth:
              Authorizer: NONE
  MonitorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: monitor_id
          AttributeType: S
      KeySchema:
        - AttributeName: monitor_id
          KeyType: HASH
  MonitorQuotaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: quota_id
          AttributeType: S
      KeySchema:
        - AttributeName: quota_id
          KeyType: HASH
  MonitorRestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        DefaultAuthorizer: AWS_IAM
        InvokeRole: CALLER_CREDENTIALS
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          ThrottlingRateLimit: 1
          ThrottlingBurstLimit: 2
  DashboardSiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  DashboardOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-dashboard-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  DashboardDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        WebACLId: !If
          - HasCloudFrontWebACL
          - !Ref CloudFrontWebACLArn
          - !Ref AWS::NoValue
        Origins:
          - Id: DashboardSiteOrigin
            DomainName: !GetAtt DashboardSiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt DashboardOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: MonitorApiOrigin
            DomainName: !Sub ${MonitorRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
            OriginPath: /Prod
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: DashboardSiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /status
            TargetOriginId: MonitorApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
        Restrictions:
          GeoRestriction:
            RestrictionType: none
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
  DashboardSiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DashboardSiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${DashboardSiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution}
  CheckQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 345600 # 4 days in seconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CheckDLQ.Arn
        maxReceiveCount: 3
      VisibilityTimeout: 90
  CheckDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days in seconds
  DispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: uptime_monitor/
      Handler: dispatcher.lambda_handler
      Runtime: python3.14
      Timeout: 30
      Environment:
        Variables:
          MONITORS_TABLE: !Ref MonitorsTable
          CHECK_QUEUE_URL: !Ref CheckQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource: !GetAtt MonitorsTable.Arn
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt CheckQueue.Arn
  DispatchSchedule:
    Type: AWS::Events::Rule
    Condition: EnableDispatchScheduleCondition
    Properties:
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt DispatcherFunction.Arn
          Id: DispatcherFunctionTarget
  DispatchSchedulePermission:
    Type: AWS::Lambda::Permission
    Condition: EnableDispatchScheduleCondition
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DispatcherFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DispatchSchedule.Arn
  CheckResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: monitor_id
          AttributeType: S
        - AttributeName: checked_at
          AttributeType: S
      KeySchema:
        - AttributeName: monitor_id
          KeyType: HASH
        - AttributeName: checked_at
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: uptime_monitor/
      Handler: worker.lambda_handler
      Runtime: python3.14
      Timeout: 15
      Environment:
        Variables:
          CHECK_RESULTS_TABLE: !Ref CheckResultsTable
          ALERT_TOPIC_ARN: !Ref AlertTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt CheckResultsTable.Arn
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref AlertTopic
      Events:
        CheckQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt CheckQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: alert-topic
  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: EnableEmailAlertsCondition
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail
Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  MonitorApiEndpoint:
    Description: API Gateway endpoint URL for the monitor API
    Value: !Sub https://${MonitorRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/monitors
  DashboardUrl:
    Description: Public CloudFront URL for the read-only dashboard
    Value: !Sub https://${DashboardDistribution.DomainName}
  DashboardBucketName:
    Description: Private S3 bucket that stores the dashboard page
    Value: !Ref DashboardSiteBucket
  CreateMonitorFunction:
    Description: Create monitor Lambda function ARN
    Value: !GetAtt CreateMonitorFunction.Arn
  CreateMonitorFunctionIamRole:
    Description: IAM role for the create monitor Lambda function
    Value: !GetAtt CreateMonitorFunctionRole.Arn
  AlertTopic:
    Description: SNS topic for alerts
    Value: !Ref AlertTopic